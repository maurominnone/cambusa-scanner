<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cambusa Scanner</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 16px; background:#f4f4f8; }
  h1 { font-size: 20px; }
  #video { width: 100%; max-width: 400px; border-radius: 8px; background:#000; }
  .field { margin-bottom: 12px; }
  label { display:block; font-weight:bold; margin-bottom:4px; }
  input, select, textarea { width:100%; padding:8px; box-sizing:border-box; font-size:16px; }
  button { padding:12px 20px; font-size:16px; border:none; border-radius:6px; background:#5b21b6; color:#fff; margin-top:8px; }
  #status { margin-top:10px; font-weight:bold; }
  #hint { margin-top:6px; color:#555; font-size:14px; }
</style>
</head>
<body>
<h1>Cambusa condivisa - Scanner</h1>
<button id="startBtn">Avvia scansione</button>
<div id="hint" style="display:none;">Inquadra il codice a barre / QR entro il riquadro, tienilo fermo e a fuoco.</div>
<video id="video" autoplay muted playsinline style="display:none;"></video>

<form id="form" action="https://script.google.com/macros/s/AKfycbzI8uw63x8Orcm7Y-t2pg2QR2cPamVKtPWCGzsVRh2LCat06BaRhFzPyWfAX9eM6vK2gw/exec" method="POST" target="hidden_iframe">
  <div class="field">
    <label>Codice a barre</label>
    <input type="text" name="codice" id="barcode" placeholder="Scansiona o digita">
  </div>
  <div class="field">
    <label>Nome prodotto</label>
    <input type="text" name="nome" id="nome">
  </div>
  <div class="field">
    <label>Quantità</label>
    <input type="number" name="quantita" id="quantita" value="1">
  </div>
  <div class="field">
    <label>Famiglia</label>
    <select name="famiglia" id="famiglia">
        <option value="Minnone">Minnone</option>
        <option value="Varisco">Varisco</option>
        <option value="Daghini">Daghini</option>
    </select>
  </div>
  <div class="field">
    <label>Note (opzionale)</label>
    <textarea name="note" id="note"></textarea>
  </div>
  <button type="submit">Invia</button>
</form>
<div id="status"></div>
<iframe name="hidden_iframe" style="display:none;"></iframe>

<script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
<script>
const startBtn = document.getElementById('startBtn');
const video = document.getElementById('video');
const hint = document.getElementById('hint');
const barcodeInput = document.getElementById('barcode');
const statusEl = document.getElementById('status');
const nomeInput = document.getElementById('nome');
const form = document.getElementById('form');
const iframe = document.querySelector('iframe[name="hidden_iframe"]');
const codeReader = new ZXing.BrowserMultiFormatReader();
let scanning = false;
let submitting = false;

startBtn.addEventListener('click', async () => {
  if (scanning) {
    codeReader.reset();
    scanning = false;
    video.style.display = 'none';
    hint.style.display = 'none';
    startBtn.textContent = 'Avvia scansione';
    return;
  }
  scanning = true;
  startBtn.textContent = 'Ferma scansione';
  video.style.display = 'block';
  hint.style.display = 'block';
  statusEl.textContent = 'Scansione in corso...';
  try {
    const devices = await codeReader.listVideoInputDevices();
    if (!devices.length) throw new Error('Nessuna fotocamera trovata');
    const backCam = devices.find(d => /back|rear|environment/i.test(d.label));
    const deviceId = backCam ? backCam.deviceId : devices[devices.length - 1].deviceId;
    codeReader.decodeFromVideoDevice(deviceId, video, (result, err) => {
      if (result) {
        barcodeInput.value = result.getText();
            lookupProduct(result.getText());
        statusEl.textContent = 'Codice rilevato: ' + result.getText();
        codeReader.reset();
        video.style.display = 'none';
        hint.style.display = 'none';
        scanning = false;
        startBtn.textContent = 'Avvia scansione';
      }
    });
  } catch (err) {
    alert('Errore accesso fotocamera: ' + err.message);
    scanning = false;
    startBtn.textContent = 'Avvia scansione';
    video.style.display = 'none';
    hint.style.display = 'none';
  }
});

form.addEventListener('submit', () => {
  submitting = true;
  statusEl.textContent = 'Invio in corso...';
});

iframe.addEventListener('load', () => {
  if (!submitting) return;
  submitting = false;
  statusEl.textContent = 'Inviato con successo!';
  form.reset();
    barcodeInput.value = '';
  });
  async function lookupProduct(barcode) {
  if (!barcode) return;
  statusEl.textContent = 'Ricerca prodotto...';
  try {
    const resp = await fetch('https://world.openfoodfacts.org/api/v2/product/' + encodeURIComponent(barcode) + '.json');
    const data = await resp.json();
    if (data && data.status === 1 && data.product) {
      const name = data.product.product_name || data.product.product_name_it || data.product.generic_name || '';
      if (name) {
        nomeInput.value = name;
        statusEl.textContent = 'Prodotto trovato: ' + name;
        return;
      }
    }
    statusEl.textContent = 'Prodotto non trovato, inserisci il nome manualmente.';
  } catch (err) {
    statusEl.textContent = 'Errore ricerca prodotto: ' + err.message;
  }
}
});
</script>
</body>
</html>
